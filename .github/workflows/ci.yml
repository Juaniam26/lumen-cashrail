name: production-gates

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run pytest -q --cov=cashrail_runtime --cov-fail-under=90
      - run: uv run ruff check .
      - run: uv run mypy cashrail_runtime
      - run: uv run bandit -q -r cashrail_runtime
      - run: uv run pip-audit
      - run: python3 tournament-spec/tools/verify_package.py
      - name: Replay database migrations
        env:
          CASHRAIL_CONTROLLER_TOKEN: test-controller-token-32-characters
          CASHRAIL_STRIPE_WEBHOOK_SECRET: whsec_test
        run: |
          migration_dir=$(mktemp -d)
          export CASHRAIL_DATABASE_URL="sqlite:///$migration_dir/test.db"
          uv run alembic upgrade head
          test "$(uv run alembic current | tail -1)" = "20260923_0002 (head)"
      - name: Validate SBOM root version
        run: python3 -c 'import json; d=json.load(open("SBOM.cdx.json")); assert d["metadata"]["component"]["version"] == "1.1.0"'
      - run: uv build
