name: production-gates

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run pytest -q --cov=cashrail_runtime --cov-fail-under=90
      - run: uv run ruff check .
      - run: uv run mypy cashrail_runtime
      - run: uv run bandit -q -r cashrail_runtime
      - run: uv run pip-audit
      - run: python3 tournament-spec/tools/verify_package.py
      - run: uv build
